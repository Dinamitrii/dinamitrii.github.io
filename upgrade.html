<!doctype html>
<html lang="bg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upgrade · Local AI</title>
<link rel="stylesheet" href="style.css">
<main>
<header class="account-bar">
  <h1>Локален AI Асистент</h1>
  <span id="account-info"></span>
  <nav><a href="index.html">Начало</a> · <a href="upgrade.html">Upgrade</a></nav>
  <button id="logout-btn" type="button">Изход</button>
</header>
<section class="upgrade">
  <h2>Free → Paid</h2>
  <p>Free включва 5 успешни изображения общо и 1500 входни + изходни чат токена общо. Историята и фактите, изпратени към модела, също се броят при всяка заявка.</p>
  <p id="usage-line"></p>
  <p id="limits-line"></p>
  <div id="stripe-area"></div>
  <p id="status" role="status" aria-live="polite"></p>
</section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
function goToStripe(button, endpoint) {
  run(button, async () => {
    const d = await api(endpoint, {});
    location.href = d.url;
  });
}

async function load() {
  const info = await api('/api/upgrade');
  el('usage-line').textContent = `Използван чат: ${info.stats.chat.used} · изображения: ${info.stats.image.used}.`;
  el('limits-line').textContent = `Paid чат лимит: ${info.paid_chat ?? 'неограничен'}; изображения: ${info.paid_images ?? 'неограничени'}. Конфигурираните лимити са общи за живота на акаунта.`;

  const area = el('stripe-area');
  area.replaceChildren();
  if (!info.stripe_enabled) {
    area.append(node('p', 'Stripe още не е конфигуриран. Плащанията са изключени.'));
    return;
  }
  area.append(node('p', info.stripe_live
    ? '6 € / месец + приложимото ДДС. Крайната сума се показва в Stripe преди потвърждение.'
    : 'ТЕСТОВ РЕЖИМ — използвайте само тестова карта. Няма истинско плащане.'));

  const params = new URLSearchParams(location.search);
  if (params.get('checkout') === 'success') {
    area.append(node('p', 'Плащането се проверява. Планът се активира след потвърждение от Stripe. Натиснете „Провери плащането“.'));
  }

  const subscribe = node('button', 'Абонирай се чрез Stripe');
  subscribe.onclick = () => goToStripe(subscribe, '/api/checkout');
  const portal = node('button', 'Управлявай абонамента');
  portal.onclick = () => goToStripe(portal, '/api/billing/portal');
  const sync = node('button', 'Провери плащането');
  sync.onclick = () => run(sync, async () => { await api('/api/billing/sync', {}); await load(); });

  area.append(subscribe, portal, sync);
}

(async () => {
  await initAccountBar();
  load().catch(e => el('status').textContent = e.message);
})();
</script>
</html>
