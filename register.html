<!doctype html>
<html lang="bg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация · Local AI</title>
<link rel="stylesheet" href="style.css">
<main>
<header class="account-bar"><h1>Локален AI Асистент</h1></header>
<section class="auth">
  <p>Free: 5 успешни изображения и 1500 общо чат токена на акаунт.</p>
  <form id="register-form">
    <label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
    <label>Парола<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
    <button>Регистрация</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p><a href="login.html">Имам акаунт</a></p>
</section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
el('register-form').onsubmit = e => {
  e.preventDefault();
  const form = e.currentTarget;
  run(form.querySelector('button'), async () => {
    const data = Object.fromEntries(new FormData(form));
    await authRequest('/api/register', data);
    location.href = 'index.html';
  });
};
</script>
