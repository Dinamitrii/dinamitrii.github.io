# /etc/nginx/sites-available/local-ai-portal
#
# Replace api.yourdomain.example with your real domain before using this.
# After Certbot runs (see DEPLOY.md) it will edit this file automatically to
# add the SSL certificate lines and an HTTP->HTTPS redirect - don't do that
# part by hand, just run certbot.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.example;

    # Stripe webhooks and large image uploads/responses need generous timeouts
    # and body size; the app itself also caps uploads at 16MB (MAX_CONTENT_LENGTH).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image generation and long chat completions can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
